# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mango-core"
BBFILE_PATTERN_mango-core = "^${LAYERDIR}/"
# prior to meta-user (7)
BBFILE_PRIORITY_mango-core = "9"

LAYERDEPENDS_mango-core = "core"

LAYERSERIES_COMPAT_mango-core = "scarthgap"
