# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mango-xilinx"
BBFILE_PATTERN_mango-xilinx = "^${LAYERDIR}/"
# prior to meta-user (7)
BBFILE_PRIORITY_mango-xilinx = "9"

# Versal machine confs and device-tree/U-Boot/kernel appends need meta-xilinx;
# the image bbappend installs packages from meta-mango-core.
LAYERDEPENDS_mango-xilinx = "core mango-core xilinx-bsp"

LAYERSERIES_COMPAT_mango-xilinx = "scarthgap"
